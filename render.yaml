services:
  - type: web
    name: omnibrain-ai
    runtime: node
    plan: free
    buildCommand: "npm test"
    startCommand: "node server/index.js"
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: APP_ENCRYPTION_KEY
        generateValue: true
