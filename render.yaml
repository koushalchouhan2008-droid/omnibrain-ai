services:
  - type: web
    name: omnibrain-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3000
      - key: DB_DIR
        value: /app/data
      - key: APP_ENCRYPTION_KEY
        sync: false
